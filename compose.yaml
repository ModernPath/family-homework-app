services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      FAMILY_APP_PASSWORD_HASH: ${FAMILY_APP_PASSWORD_HASH:?Set a password hash before starting}
      FAMILY_AUTH_SECRET: ${FAMILY_AUTH_SECRET:?Set a random auth secret before starting}
      FAMILY_AUTH_COOKIE_SECURE: ${FAMILY_AUTH_COOKIE_SECURE:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
